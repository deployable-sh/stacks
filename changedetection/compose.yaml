name: changedetection

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.2
    restart: unless-stopped
    environment:
      PORT: "5000"
      BASE_URL: ${BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - datastore:/datastore

volumes:
  datastore:
