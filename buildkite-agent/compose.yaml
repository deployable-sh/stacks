name: buildkite-agent

services:
  agent:
    image: buildkite/agent:4-ubuntu
    restart: unless-stopped
    environment:
      BUILDKITE_AGENT_TOKEN: ${BUILDKITE_AGENT_TOKEN}
      BUILDKITE_AGENT_TAGS: ${BUILDKITE_AGENT_TAGS:-queue=miget}
    volumes:
      - builds:/buildkite/builds

volumes:
  builds:
