# JWT_SECRET is generated per deploy; ANON_KEY / SERVICE_ROLE_KEY are the
# Supabase API keys, derived from it as HS256 JWTs by the platform (no
# per-image derive wrapper). VAULT_ENC_KEY must be exactly 32 chars.
x-miget:
  variables:
    VAULT_ENC_KEY: { generate: hex, length: 16 }
    SECRET_KEY_BASE: { generate: hex, length: 64 }
    ANON_KEY:
      derive: hs256_jwt
      from: JWT_SECRET
      claims: { role: anon, iss: supabase, iat: 1700000000, exp: 2000000000 }
    SERVICE_ROLE_KEY:
      derive: hs256_jwt
      from: JWT_SECRET
      claims: { role: service_role, iss: supabase, iat: 1700000000, exp: 2000000000 }

services:
  kong:
    x-miget:
      ram: "512"
    environment:
      # Miget pods are dual-stack; bind both families so the alias
      # Service's IPv6 VIP accepts connections.
      KONG_PROXY_LISTEN: "0.0.0.0:5000, [::]:5000"
      JWT_SECRET: ${JWT_SECRET:?}
      # Use the platform-derived API keys (not kong's own derivation) so kong's
      # exact-match key-auth consumers equal the keys every other service and
      # client uses. Setting ANON_KEY/SERVICE_ROLE_KEY skips the entrypoint's
      # self-derivation; SUPABASE_ANON_KEY/SUPABASE_SERVICE_KEY are what kong.yml
      # actually reads.
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Username you will use to log in to the Supabase dashboard}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Password for the Supabase dashboard login}

  studio:
    x-miget: { ram: "512", private: true }
    # Upstream's healthcheck spawns a whole Node runtime every 5s (~40Mi, ~460ms
    # CPU). In a memory-capped pod that starves the probe itself: it times out
    # and the liveness kill restarts a perfectly healthy Studio. Same check
    # (GET /api/platform/profile must return 200) in pure bash over /dev/tcp:
    # no new runtime, ~36ms.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /api/platform/profile HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
    # Studio's healthcheck needs meta and db; without the gate it
    # crash-loops through stack bring-up.
    depends_on: [db, meta]
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?}
      SUPABASE_PUBLIC_URL: ${{kong.public_url}}
      # Keep Next.js on the compose-declared port: kong routes to
      # supabase-studio:3000 and the healthcheck probes it. Without this
      # the platform's PORT default moves studio to 5000.
      PORT: "3000"
      HOSTNAME: "::"
      # Belt-and-suspenders: kong/meta now dual-bind, but keep A-first
      # resolution for any remaining IPv4-only upstream.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      # Shared with the functions service so Studio lists them, and persistent
      # SQL snippets (the base leaves both folders unmounted -> Studio errors).
      - functions-src:/app/edge-functions
      - studio-snippets:/app/snippets

  auth:
    x-miget: { ram: "512", private: true }
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      API_EXTERNAL_URL: ${{kong.public_url}}
      SITE_URL: ${{kong.public_url}}

  rest:
    x-miget: { ram: "512", private: true }
    environment:
      # "*" = any IPv4 or IPv6 -- storage (Node) resolves AAAA-first and the
      # default PostgREST bind is IPv4 only.
      PGRST_SERVER_HOST: "*"
      JWT_SECRET: ${JWT_SECRET:?}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

  realtime:
    x-miget: { ram: "1024", private: true }
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      # realtime's own healthcheck sends Bearer ${ANON_KEY}; give it the real key.
      ANON_KEY: ${ANON_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}

  storage:
    x-miget: { ram: "512", private: true }
    # Base healthcheck probes the service alias (dual-stack, AAAA-first) but
    # storage binds IPv4 -> probe hits the dead v6 VIP. Self-check localhost.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # File backend, so S3 is unused; GLOBAL_S3_BUCKET is only a logical
      # default-bucket name (the base leaves it bare -> the platform would
      # otherwise hex-fill it as if it were a secret).
      GLOBAL_S3_BUCKET: supabase-storage
      JWT_SECRET: ${JWT_SECRET:?}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SUPABASE_PUBLIC_URL: ${{kong.public_url}}
    volumes:
      # File backend persistence; shared with imgproxy for image transforms.
      - storage-data:/var/lib/storage

  meta:
    x-miget: { ram: "512", private: true }
    environment:
      PG_META_HOST: "::"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?}

  db:
    x-miget: { ram: "2048", private: true }
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATA: /var/lib/postgresql/data/pgdata

  supavisor:
    x-miget: { ram: "1024", private: true }
    # Bakes /etc/pooler/pooler.exs (upstream bind-mounts it; Miget has none).
    build: ./supavisor
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:?}

  functions:
    x-miget: { ram: "512", private: true }
    # Wrapper bakes + seeds the default functions into the shared volume.
    build: ./functions
    volumes:
      - functions-src:/home/deno/functions
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SUPABASE_PUBLIC_URL: ${{kong.public_url}}

  imgproxy:
    x-miget: { ram: "512", private: true }
    volumes:
      - storage-data:/var/lib/storage

volumes:
  dbdata:
    x-miget: { size: "20000", type: RWO }
  # Deno dependency cache for edge functions (opt-in `functions` profile).
  deno-cache:
    x-miget: { size: "2000", type: RWX }
  # Storage file-backend data, shared with imgproxy.
  storage-data:
    x-miget: { size: "10000", type: RWX }
  # Edge-functions source, shared between functions (serves) and studio (lists).
  functions-src:
    x-miget: { size: "1000", type: RWX }
  # Studio SQL snippets.
  studio-snippets:
    x-miget: { size: "500", type: RWX }
